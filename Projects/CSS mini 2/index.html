<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Mini 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main_box">
        <input type="checkbox" name="check" id="check">
        <div class="btn_one">
            <label for="check">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </label>
        </div>

        <div class="sidebar_menu">
            <div class="logo">
                <a href="#"> Menu </a>
            </div>
            <div class="btn_two">
                <label for="check">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </label>
            </div>

            <div class="menu">
                <ul>
                    <li>
                        <i class="fa-solid fa-images"></i>
                        <a href="#">Gallery</a>
                    </li>
                    <li>
                        <i class="fa-solid fa-photo-film"></i>
                        <a href="#">Exhibits</a>
                    </li>
                    <li>
                        <i class="fa-regular fa-share-from-square"></i>
                        <a href="#">Shortcuts</a>
                    </li>
                    <li>
                        <i class="fa-solid fa-calendar-days"></i>
                        <a href="#">Events</a>
                    </li>
                    <li>
                        <i class="fa-solid fa-store"></i>
                        <a href="#">Store</a>
                    </li>
                    <li>
                        <i class="fa-solid fa-phone"></i>
                        <a href="#">Contact</a>
                    </li>
                    <li>
                        <i class="fa-regular fa-comments"></i>
                        <a href="#">Feedback</a>
                    </li>
                </ul>

            </div>
            <div class="socials">
                <ul>
                    <a href="#" style="text-decoration-line: none;"> <i class="fa-brands fa-facebook"></i> </a>
                    <a href="#" style="text-decoration-line: none;"> <i class="fa-brands fa-youtube"></i> </a>
                    <a href="#" style="text-decoration-line: none;"> <i class="fa-brands fa-instagram"></i> </a>
                    <a href="#" style="text-decoration-line: none;"> <i class="fa-brands fa-reddit"></i> </a>
                </ul>
            </div>
        </div>
    </div>
</body>

</html>
